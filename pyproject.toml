[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-management-ollama"
version = "0.1.0"
description = "Local PDF document register powered by Ollama and Excel."
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5",
    "PyMuPDF>=1.24.0",
    "pypdf>=5.0.0",
]

[project.scripts]
doc-register = "doc_register.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
